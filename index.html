<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="card">
    <div id="gift" class="gift-icon">🎉</div>
    <h1 id="title">Tap the gift!</h1>
    <p id="message" class="hidden">Wishing you a year ahead filled with love, laughter, and endless happiness! ✄🎊</p>
    <div id="gallery" class="hidden">
      <img src="photo1.png" class="photo">
      <img src="photo2.png" class="photo">
      <img src="photo3.png" class="photo">
      <img src="photo4.png" class="photo">
      <img src="photo5.png" class="photo">
      <img src="photo6.png" class="photo">
      <img src="photo7.png" class="photo">
    </div>
  </div>
  <audio id="bday-music" src="hbd.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
